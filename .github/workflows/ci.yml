name: CI

# Actions are pinned to commit SHAs (dependabot proposes bumps), the Rust
# toolchain comes from rust-toolchain.toml, and wasm-pack is pinned by
# version: no floating dependency can silently change what ships.
on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository; nothing here needs write access.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Install fixture reproducibility tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq libarchive-tools

      - name: Verify demo fixtures are reproducible
        run: |
          ./fixtures/make_fixtures.sh
          git diff --exit-code -- web/fixtures

      - name: Install wasm-pack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM module
        run: TRACE_BUILD_COMMIT="${{ github.sha }}" wasm-pack build crates/trace-core --target web --release --out-dir ../../web/pkg -- --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies
        run: cargo audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install wasm-pack
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-pack@0.14.0

      - name: Build WASM module
        run: TRACE_BUILD_COMMIT="${{ github.sha }}" wasm-pack build crates/trace-core --target web --release --out-dir ../../web/pkg -- --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e

      - name: Run browser E2E tests
        run: npx playwright test
        working-directory: e2e
